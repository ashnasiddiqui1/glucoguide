services:
  - type: web
    name: glucoguide
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /tmp/glucoguide.json
      - key: SESSION_SECRET
        generateValue: true
